# Every 30 minutes: collect headlines from the RSS feeds a browser page can't read
# (Detik, Tempo, Liputan6, Republika, Viva, Sindonews) with tools/update_news.py,
# and publish the JSON as the only commit on the `news-data` branch. The Berita tab
# reads it from raw.githubusercontent.com. `main` and its Pages builds are untouched.
# To stop it: Actions tab → "Kumpulkan berita" → Disable workflow.
name: Kumpulkan berita

on:
  schedule:
    - cron: "7,37 * * * *"   # off the hour, when GitHub's scheduler is least busy
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Collect headlines
        run: |
          # the last published file: a feed that fails this time keeps its recent headlines from it
          git fetch -q --depth 1 origin news-data && git show FETCH_HEAD:news.json > prev.json || rm -f prev.json
          python3 tools/update_news.py --previous prev.json --out news-out/news.json

      - name: Publish to the news-data branch
        working-directory: news-out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b news-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -q -m "Headlines collected $(date -u +%Y-%m-%dT%H:%MZ)"
          # one commit, replaced each run: no history piles up
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" news-data
